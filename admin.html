<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3eee3;color:#1d2a26;font-family:'Amiri',serif;font-size:19px;line-height:1.7}
.top{position:sticky;top:0;z-index:5;background:#1f4a40;color:#f6f1e7;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 22px;flex-wrap:wrap}
.top b{font-size:22px}
button,.b{font-family:inherit;font-size:17px;border:1px solid #9a7424;background:transparent;color:inherit;padding:6px 18px;cursor:pointer;border-radius:2px}
button.p{background:#9a7424;color:#fff}
button:disabled{opacity:.5}
.wrap{max-width:900px;margin:0 auto;padding:26px 18px 80px}
.card{background:#fbf8f1;border:1px solid #d8cdb6;padding:22px;margin-bottom:22px}
h2{margin:0 0 14px;color:#1f4a40;font-size:25px}
h3{margin:18px 0 8px;font-size:19px;color:#9a7424}
label{display:block;font-size:16px;color:#5d6a64;margin-top:10px}
input,textarea{width:100%;font-family:inherit;font-size:18px;padding:8px 10px;border:1px solid #cfc3a8;background:#fff;color:#1d2a26;border-radius:2px}
textarea{min-height:130px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{border:1px dashed #cfc3a8;padding:12px 14px;margin-top:12px;position:relative}
.item .x{position:absolute;inset-inline-end:8px;top:8px;font-size:15px;padding:2px 10px;color:#a33}
.rs{display:grid;grid-template-columns:34px 1fr 90px 34px;gap:8px;margin-top:6px;align-items:center}
.rs span{color:#9a7424;text-align:center}
#msg{position:fixed;bottom:18px;inset-inline-start:18px;background:#1d2a26;color:#fff;padding:10px 18px;display:none;max-width:80vw;z-index:9}
.note{font-size:16px;color:#5d6a64}
ol{padding-inline-start:22px}
code{background:#eee6d3;padding:1px 6px;direction:ltr;display:inline-block}
.prev{max-width:180px;margin-top:8px;display:block}
@media(max-width:640px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><b>لوحة التحكم</b><div><a class="b" href="./" target="_blank">عرض الموقع</a> <button id="logout" style="display:none">خروج</button> <button class="p" id="save" style="display:none">حفظ ونشر</button></div></div>
<div class="wrap" id="app"></div>
<div id="msg"></div>
<script>
var C=null,PW=sessionStorage.getItem('adm_pw')||'';
var LB={hero:'الواجهة الرئيسية',about:'النبذة',expertise:'الخبرات',results:'نتائج الطلبة',school:'أماكن العمل',posts:'الأخبار والمنشورات',contact:'التواصل'};
var KL={eyebrow:'العنوان الصغير',name:'الاسم',role:'الصفة / الشهادة',lede:'النص التعريفي',photo:'مسار الصورة',title:'العنوان',p1:'الفقرة الأولى',p2:'الفقرة الثانية',facts:'المعلومات السريعة',k:'العنوان',v:'القيمة',items:'العناصر',t:'العنوان',d:'الوصف',note:'ملاحظة',text:'النص',whatsapp:'رقم الواتساب (بدون +)',whatsapp_display:'الرقم كما يظهر',telegram:'معرّف تلغرام (بدون @)',date:'التاريخ',body:'النص',image:'الصورة'};
function msg(t,ok){var m=document.getElementById('msg');m.textContent=t;m.style.display='block';m.style.background=ok===false?'#8a2a2a':'#1d2a26';clearTimeout(msg.t);msg.t=setTimeout(function(){m.style.display='none'},4500)}
function api(body){body.password=PW;return fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.status);return j})})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function login(){
 document.getElementById('save').style.display='none';document.getElementById('logout').style.display='none';
 document.getElementById('app').innerHTML='<div class="card"><h2>الدخول</h2><p class="note">أدخل كلمة مرور لوحة التحكم.</p><label>كلمة المرور</label><input id="tk" type="password" dir="ltr" autocomplete="current-password"><p><button class="p" id="go">دخول</button></p></div>';
 var go=function(){PW=document.getElementById('tk').value;if(!PW)return;load()};
 document.getElementById('go').onclick=go;document.getElementById('tk').onkeydown=function(e){if(e.key==='Enter')go()}
}
function load(){
 api({action:'check'}).then(function(){sessionStorage.setItem('adm_pw',PW);return fetch('content.json?v='+Date.now()).then(function(r){return r.json()})}).then(function(c){C=c;draw()}).catch(function(e){sessionStorage.removeItem('adm_pw');PW='';login();msg('تعذر الدخول: '+e.message,false)})
}
function lbl(k){return KL[k]||k}
function isBi(o){return o&&typeof o==='object'&&!Array.isArray(o)&&('ar' in o)&&('en' in o)}
function ctl(path,l,val,dir,long){return long?'<textarea '+dir+' data-p="'+path.join('.')+'.'+l+'">'+esc(val)+'</textarea>':'<input '+dir+' data-p="'+path.join('.')+'.'+l+'">'}
function field(path,v,k){
 if(isBi(v)){var long=(v.ar||'').length>70||(v.en||'').length>70;
  return '<label>'+lbl(k)+'</label><div class="row"><div><small class="note">عربي</small>'+ctl(path,'ar',v.ar,'',long)+'</div><div><small class="note">English</small>'+ctl(path,'en',v.en,'dir="ltr"',long)+'</div></div>'}
 if(Array.isArray(v)){
  if(path.join('.')==='results.students')return studs(path,v);
  var h='<h3>'+lbl(k)+'</h3>';
  v.forEach(function(x,i){h+='<div class="item"><button class="x" data-del="'+path.join('.')+'" data-i="'+i+'">حذف</button>'+(typeof x==='object'?objf(path.concat(i),x):'')+'</div>'});
  return h+'<p><button data-add="'+path.join('.')+'">+ إضافة</button></p>'}
 if(typeof v==='object')return '<h3>'+lbl(k)+'</h3>'+objf(path,v);
 var long2=String(v).length>70,dir=(k==='photo'||k==='image'||/whats|tele|date/.test(k))?'dir="ltr" ':'';
 return '<label>'+lbl(k)+'</label>'+(long2?'<textarea data-p="'+path.join('.')+'">'+esc(v)+'</textarea>':'<input '+dir+'data-p="'+path.join('.')+'">')
}
function objf(path,o){var h='';Object.keys(o).forEach(function(k){h+=field(path.concat(k),o[k],k)});return h}
function studs(path,v){
 var h='<h3>الطلبة والدرجات</h3><p class="note">تُحسب الإحصائيات (العدد، الدرجة الكاملة، المعدّل) تلقائيًا من هذه القائمة.</p><div id="studs">';
 v.forEach(function(s,i){h+='<div class="rs"><span>'+(i+1)+'</span><input data-s="'+i+'" data-f="name"><input data-s="'+i+'" data-f="score" type="number" min="0" max="100" dir="ltr"><button data-sd="'+i+'">×</button></div>'});
 return h+'</div><p><button id="sadd">+ إضافة طالب</button></p>'}
function getp(o,p){return p.split('.').reduce(function(a,k){return a[k]},o)}
function setp(o,p,val){var ks=p.split('.'),l=ks.pop();ks.reduce(function(a,k){return a[k]},o)[l]=val}
function sync(){document.querySelectorAll('[data-p]').forEach(function(e){setp(C,e.dataset.p,e.value)});document.querySelectorAll('[data-s]').forEach(function(e){var s=C.results.students[e.dataset.s];s[e.dataset.f]=e.dataset.f==='score'?(+e.value||0):e.value})}
function fill(){document.querySelectorAll('[data-p]').forEach(function(e){if(e.tagName==='INPUT')e.value=getp(C,e.dataset.p)});document.querySelectorAll('[data-s]').forEach(function(e){e.value=C.results.students[e.dataset.s][e.dataset.f]})}
function blank(o){if(isBi(o))return{ar:'',en:''};if(Array.isArray(o))return[];if(typeof o==='object'){var r={};for(var k in o)r[k]=blank(o[k]);return r}return''}
function draw(){
 var h='';
 ['hero','about','expertise','results','school','posts','contact'].forEach(function(k){
  h+='<div class="card"><h2>'+LB[k]+'</h2>'+objf([k],C[k])+(k==='hero'?'<h3>تغيير الصورة الشخصية</h3><input type="file" id="ph" accept="image/*"><img class="prev" src="'+esc(C.hero.photo)+'">':'')+(k==='posts'?'<h3>رفع صورة لمنشور</h3><p class="note">ارفع الصورة ثم الصق المسار الناتج في حقل الصورة داخل المنشور.</p><input type="file" id="up" accept="image/*"><p class="note" id="upr"></p>':'')+'</div>'});
 document.getElementById('app').innerHTML=h;fill();
 document.getElementById('save').style.display='';document.getElementById('logout').style.display='';
 bind()
}
function bind(){
 var app=document.getElementById('app');
 app.onclick=function(e){var t=e.target;sync();
  if(t.dataset.del){var a=getp(C,t.dataset.del);a.splice(+t.dataset.i,1);draw()}
  else if(t.dataset.add){var a=getp(C,t.dataset.add);var tpl=a.length?blank(a[0]):(t.dataset.add==='posts.items'?{date:'',title:{ar:'',en:''},body:{ar:'',en:''},image:''}:{});if(t.dataset.add==='posts.items')tpl.date=new Date().toISOString().slice(0,10);a.unshift(tpl);draw()}
  else if(t.dataset.sd!==undefined){C.results.students.splice(+t.dataset.sd,1);draw()}
  else if(t.id==='sadd'){C.results.students.push({name:'',score:100});draw()}
 };
 document.getElementById('ph').onchange=function(){upload(this.files[0],function(p){sync();C.hero.photo=p;draw();msg('تم رفع الصورة، اضغط حفظ ونشر')})};
 document.getElementById('up').onchange=function(){upload(this.files[0],function(p){document.getElementById('upr').innerHTML='مسار الصورة: <code>'+p+'</code>'})};
}
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=1600,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.86).split(',')[1])};im.src=r.result};r.readAsDataURL(file)}
function upload(file,cb){if(!file)return;msg('جارٍ رفع الصورة...');shrink(file,function(b){api({action:'upload',data:b}).then(function(j){cb(j.path)}).catch(function(e){msg('فشل الرفع: '+e.message,false)})})}
document.getElementById('save').onclick=function(){
 sync();var btn=this;btn.disabled=true;C.posts.items=C.posts.items||[];
 api({action:'save',content:C}).then(function(){msg('تم الحفظ. يظهر التعديل في الموقع خلال دقيقة تقريبًا.')}).catch(function(e){msg('فشل الحفظ: '+e.message,false)}).then(function(){btn.disabled=false})};
document.getElementById('logout').onclick=function(){sessionStorage.removeItem('adm_pw');location.reload()};
if(PW)load();else login();
</script>
</body>
</html>
